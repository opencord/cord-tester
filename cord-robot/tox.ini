[tox]
envlist = py35,py36
skip_missing_interpreters = true

[testenv]
# remove the git+https link and add to requirements.txt when upstream fixes the pypi package
deps =
  -r requirements.txt
  flake8
  pylint
  robotframework-lint
  git+https://github.com/rasjani/robotframework-importresource@0e0388f3ee2ca21dc2e56bdc88ed88a4ee0443a6

# LineToLong should be much lower
commands =
  flake8
  pylint --py3k CORDRobot
  rflint \
     --configure TooFewKeywordSteps:1 \
     --configure LineTooLong:160 -e LineTooLong \
     CORDRobot/rf-resources
  robot test/load.robot

[flake8]
exclude =
  .tox
  build
max-line-length = 119

# get rid of this after the * imports are removed from __init__.py
per-file-ignores =
  CORDRobot/__init__.py:F401,F403
